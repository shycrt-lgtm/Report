name: collect-keei
on:
  schedule:
    - cron: "29 0 * * 1-5"   # 평일 09:29 KST
  workflow_dispatch:
    inputs:
      probe:
        description: "1이면 등록하지 않고 구조만 점검"
        required: false
        default: "0"
permissions:
  contents: write
concurrency: reports-json-update
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pypdf
      - run: python3 collect_keei.py | tee probe.txt
        env:
          PROBE: ${{ github.event.inputs.probe }}
      - name: Save probe output (점검 실행 때만, 별도 브랜치)
        if: github.event.inputs.probe == '1'
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan keei-probe && git rm -rfq --cached . && git add probe.txt && git commit -qm probe && git push -f origin keei-probe
      - name: Commit
        if: github.event.inputs.probe != '1'
        run: |
          rm -f probe.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "KEEI 국제유가 및 시장 동향 새 호 등록"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
