name: Collect Lawmaking Notices

on:
  schedule:
    - cron: '10 23 * * *'   # 매일 08:10 (KST)
  workflow_dispatch:
  push:
    paths:
      - 'collect_lawmaking.py'
      - 'lawmaking_filter.json'
      - '.github/workflows/collect_lawmaking.yml'

permissions:
  contents: write

concurrency:
  group: reports-json-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect 입법예고
        env:
          LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}
        run: python collect_lawmaking.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json lawmaking_debug.json
          git diff --staged --quiet || git commit -m "Auto: 입법예고 수집 [$(date +'%Y-%m-%d')]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push 재시도 $i/5"; sleep 5
          done
          exit 1
