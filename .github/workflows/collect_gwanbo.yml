name: Collect Gwanbo Personnel

on:
  schedule:
    - cron: '20 23 * * *'   # 매일 08:20 (KST)
  workflow_dispatch:
  push:
    paths:
      - 'collect_gwanbo.py'
      - '.github/workflows/collect_gwanbo.yml'

permissions:
  contents: write

concurrency:
  group: reports-json-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect 관보 인사(기후에너지환경부)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_gwanbo.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json gwanbo_debug.json
          git diff --staged --quiet || git commit -m "Auto: 인사발령 수집 [$(date +'%Y-%m-%d')]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push 재시도 $i/5"; sleep 5
          done
          exit 1
