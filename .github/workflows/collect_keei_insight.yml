name: collect-keei-insight
on:
  schedule:
    - cron: "35 0 * * 1-5"   # 평일 09:35 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency: reports-json-update
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect_keei_insight.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "세계 에너지시장 인사이트 새 호 등록"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
