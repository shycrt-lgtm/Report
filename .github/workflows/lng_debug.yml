name: lng-debug
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dbg
          curl -sS -L -m 60 -A "Mozilla/5.0" -D dbg/hdr.txt -o dbg/list.html "http://www.lngkorea.or.kr/bbs/board.php?bo_table=statistics" || true
          head -n 12 dbg/hdr.txt; wc -c dbg/list.html
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dbg; git commit -m "lng debug" || true; git pull --rebase && git push
