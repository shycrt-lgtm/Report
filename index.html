        <p class="sub">최종 업데이트: <b id="headerDate">-</b> | 국내외 기관 리포트 요약 | 에너지사업총괄</p>
      </div>
      <nav class="menu">

  <div class="mx-auto" style="max-width:1000px;padding:28px 16px 48px">
    <div class="flex" style="justify-content:space-between;align-items:stretch;gap:10px 12px;flex-wrap:wrap">
      <nav class="etc-menu" id="cats"></nav>
      <div class="kpx-pick flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm" style="margin-left:auto">
        <label for="q" class="text-xs md:text-sm font-bold text-slate-700 cursor-pointer">검색:</label>
        <input type="search" id="q" class="bg-transparent text-xs md:text-sm font-bold text-slate-800 outline-none" placeholder="제목·요약 검색">
      </div>
    </div>

    <div>
      <h2>리포트 목록</h2>
      <p class="text-xs text-slate-500 mb-2" id="count"></p>
      <div id="list"></div>
      <p class="text-[11px] text-slate-500 mt-2 px-1 tracking-tight">* 요약·시사점은 Claude가 원문을 읽고 작성한 것으로, 수치와 해석은 원문 확인이 필요합니다. 원문 저작권은 각 발행 기관에 있습니다.</p>
    </div>
  </div>

  <script>
  (function () {
    var state = { items: [], category: "전체", query: "", sub: "전체" };
    var listEl = document.getElementById("list");
    var catsEl = document.getElementById("cats");
    var countEl = document.getElementById("count");

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function fmtDate(s) { return (s || "").replace(/-/g, "."); }
    function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }

    function renderCats() {
      var cats = ["전체"];
      state.items.forEach(function (it) {
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
      cats.push("자체자료");
      catsEl.style.display = "";
      catsEl.innerHTML = "";
      cats.forEach(function (c) {
        var a = el("a", "cat-btn", c === "자체자료" ? c + (state.internal ? " \uD83D\uDD13" : " \uD83D\uDD12") : c);
        a.setAttribute("role", "button");
        a.setAttribute("aria-pressed", String(c === state.category));
        a.style.minWidth = "110px";
        a.addEventListener("click", function () {
          if (c === "자체자료" && !state.internal) { askPassword(); return; }
          state.category = c; renderCats(); render();
        });
        catsEl.appendChild(a);
      });
    }

    function link(label, url, primary) {
      var a = el("a", primary ? "primary" : "", label);
      a.href = safeUrl(url);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      return a;
    }

    function card(it) {
      var c = el("article", "rp-card");
      var meta = el("div", "rp-meta");
      meta.appendChild(el("span", "rp-tag", it.category || "기타"));
      meta.appendChild(el("span", "", it.source || ""));
      if (it.series) meta.appendChild(el("span", "", "| " + it.series));
      meta.appendChild(el("span", "", "| " + fmtDate(it.date)));
      c.appendChild(meta);
      var h3 = el("h3", "");
      if (it.prefix) h3.appendChild(el("span", "rp-prefix", "[" + it.prefix + "] "));
      h3.appendChild(document.createTextNode((it.locked ? "\uD83D\uDD12 " : "") + it.title));
      c.appendChild(h3);
      if (it.period) c.appendChild(el("p", "rp-period", (it.period_label || "대상 기간") + ": " + it.period));

      var sum = it.summary || [];
      var ul = el("ul", "rp-sum");
      if (!sum.length) ul.style.display = "none";
      sum.slice(0, 3).forEach(function (s) { ul.appendChild(el("li", "", s)); });
      c.appendChild(ul);
      if (sum.length > 3) {
        var d = el("details");
        d.appendChild(el("summary", "", "요약 전체 보기 (" + sum.length + "건)"));
        var ul2 = el("ul", "rp-sum");
        ul2.style.marginTop = "8px";
        sum.slice(3).forEach(function (s) { ul2.appendChild(el("li", "", s)); });
        d.appendChild(ul2);
        c.appendChild(d);
      }
      if (it.implications && it.implications.length) {
        var box = el("div", "rp-impl");
        box.appendChild(el("b", "", "시사점"));
        var iu = el("ul");
        it.implications.forEach(function (s) { iu.appendChild(el("li", "", s)); });
        box.appendChild(iu);
        c.appendChild(box);
      }
      if (it.sections && it.sections.length) {
        var sl = el("ul", "rp-sum");
        it.sections.forEach(function (sec) {
          var li = el("li", "");
          var a = document.createElement("a");
          a.href = safeUrl(sec.url); a.target = "_blank"; a.rel = "noopener";
          a.textContent = sec.title;
          a.style.textDecoration = "underline";
          li.appendChild(a);
          li.appendChild(document.createTextNode(" (PDF 다운로드)"));
          sl.appendChild(li);
        });
        c.appendChild(sl);
      }
      var nav = el("nav", "etc-menu rp-links");
      if (it.locked) {
        var la = el("a", "primary", "자체자료에서 열기 (비밀번호 필요)");
        la.href = "internal.html";
        nav.appendChild(la);
      } else if (it.url) nav.appendChild(link(it.link_label || "원문 보기", it.url, true));
      if (it.detail_url) nav.appendChild(link("게시글 보기", it.detail_url, false));
      c.appendChild(nav);
      return c;
    }

    var KEY_OK = "energyInternal.pw";
    function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) b64a(a, i, b.charCodeAt(i)); return a; }
    function b64a(a, i, v) { a[i] = v; }
    function unlock(pw) {
      return fetch("internal.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
        var e = d.index;
        return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"])
          .then(function (base) {
            return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(e.salt), iterations: e.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
          })
          .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(e.iv) }, k, b64(e.ct)); })
          .then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
      });
    }
    function tryUnlock(pw, errEl) {
      if (!window.crypto || !crypto.subtle) { if (errEl) errEl.textContent = "이 브라우저에서는 열 수 없습니다. 최신 크롬·엣지에서 https 주소로 접속하세요."; return Promise.resolve(false); }
      return unlock(pw).then(function (data) {
        state.internal = data;
        renderCats();
        try { sessionStorage.setItem(KEY_OK, pw); } catch (e) {}
        render();
        return true;
      }, function () { if (errEl) errEl.textContent = "비밀번호가 맞지 않습니다."; return false; });
    }
    function askPassword() {
      if (document.getElementById("pwModal")) return;
      var spw = null; try { spw = sessionStorage.getItem(KEY_OK); } catch (e) {}
      function enter() { state.category = "자체자료"; renderCats(); render(); }
      if (spw) { tryUnlock(spw, null).then(function (ok) { if (ok) enter(); else openModal(); }); return; }
      openModal();
      function openModal() {
        var ov = el("div"); ov.id = "pwModal";
        ov.style.cssText = "position:fixed;inset:0;background:rgba(0,31,63,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px";
        var box = el("form", "");
        box.autocomplete = "off";
        box.style.cssText = "background:#fff;border-top:4px solid #001f3f;width:100%;max-width:380px;padding:22px 22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25)";
        box.appendChild(el("h3", "", "\uD83D\uDD12 자체자료"));
        box.lastChild.style.cssText = "margin:0 0 6px;font-size:18px;font-weight:700;color:#001f3f";
        box.appendChild(el("p", "", "비밀번호를 입력하세요."));
        box.lastChild.style.cssText = "margin:0 0 12px;font-size:14px;color:#475569";
        var inp = document.createElement("input");
        inp.type = "password"; inp.placeholder = "비밀번호"; inp.setAttribute("aria-label", "비밀번호");
        inp.style.cssText = "width:100%;border:1px solid #cbd5e1;padding:10px 12px;font-size:14px;border-radius:2px";
        box.appendChild(inp);
        var err = el("p", ""); err.setAttribute("role", "alert");
        err.style.cssText = "color:#dc2626;font-size:13px;margin:8px 0 0;min-height:18px";
        box.appendChild(err);
        var row = el("nav", "etc-menu"); row.style.marginTop = "10px";
        var ok = el("a", "primary cat-btn", "확인"); ok.setAttribute("role", "button");
        var cancel = el("a", "cat-btn", "취소"); cancel.setAttribute("role", "button");
        ok.style.cssText = cancel.style.cssText = "flex:1;min-width:0";
        row.appendChild(ok); row.appendChild(cancel); box.appendChild(row);
        ov.appendChild(box); document.body.appendChild(ov);
        function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); }
        function go() { err.textContent = "확인 중..."; tryUnlock(inp.value, err).then(function (good) { if (good) { close(); enter(); } }); }
        ok.addEventListener("click", go); cancel.addEventListener("click", close);
        box.addEventListener("submit", function (e) { e.preventDefault(); go(); });
        ov.addEventListener("click", function (e) { if (e.target === ov) close(); });
        document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
        setTimeout(function () { inp.focus(); }, 0);
      }
    }
    function renderInternal() {
      var gate = el("form", "rp-card");
      gate.autocomplete = "off";
      gate.style.maxWidth = "420px"; gate.style.margin = "24px auto";
      gate.appendChild(el("h3", "", "\uD83D\uDD12 자체자료"));
      gate.appendChild(el("p", "rp-period", "비밀번호를 입력하면 자료 목록이 보입니다."));
      var inp = document.createElement("input");
      inp.type = "password"; inp.placeholder = "비밀번호"; inp.setAttribute("aria-label", "비밀번호");
      inp.style.cssText = "width:100%;border:1px solid #cbd5e1;padding:10px 12px;font-size:14px;border-radius:2px";
      gate.appendChild(inp);
      var nav = el("nav", "etc-menu"); nav.style.marginTop = "12px";
      var btn = el("a", "primary cat-btn", "열기"); btn.setAttribute("role", "button"); btn.style.minWidth = "100%";
      nav.appendChild(btn); gate.appendChild(nav);
      var err = el("p", ""); err.setAttribute("role", "alert"); err.style.cssText = "color:#dc2626;font-size:13px;margin:10px 0 0;min-height:18px";
      gate.appendChild(err);
      function go() { err.textContent = "확인 중..."; tryUnlock(inp.value, err).then(function (ok) { if (ok) err.textContent = ""; }); }
      btn.addEventListener("click", go);
      gate.addEventListener("submit", function (e) { e.preventDefault(); go(); });
      listEl.appendChild(gate);
      setTimeout(function () { inp.focus(); }, 0);
    }
    function showInternal() {
      var data = state.internal, q = state.query.trim().toLowerCase();
      var subs = ["전체"].concat(data.categories);
      if (subs.indexOf(state.sub) < 0) state.sub = "전체";
      var bar = el("nav", "etc-menu"); bar.style.marginBottom = "14px";
      subs.forEach(function (c) {
        var a = el("a", "cat-btn", c);
        a.setAttribute("role", "button");
        a.setAttribute("aria-pressed", String(c === state.sub));
        a.style.minWidth = "110px";
        a.addEventListener("click", function () { state.sub = c; render(); });
        bar.appendChild(a);
      });
      listEl.appendChild(bar);
      var rows = data.items.filter(function (it) {
        if (state.sub !== "전체" && it.category !== state.sub) return false;
        return !q || (it.title + " " + it.category).toLowerCase().indexOf(q) >= 0;
      }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      countEl.textContent = "총 " + rows.length + "건";
      if (!rows.length) listEl.appendChild(el("div", "rp-empty", "해당 분류에 등록된 자료가 없습니다."));
      rows.forEach(function (it) {
        var c = el("article", "rp-card");
        var m = el("div", "rp-meta"); m.appendChild(el("span", "rp-tag", it.category)); m.appendChild(el("span", "", "| " + fmtDate(it.date)));
        c.appendChild(m); c.appendChild(el("h3", "", it.title));
        var nav = el("nav", "etc-menu rp-links"); var a = el("a", "primary", "자료 열기"); a.href = it.url; nav.appendChild(a);
        c.appendChild(nav); listEl.appendChild(c);
      });
    }

    function render() {
      var q = state.query.trim().toLowerCase();
      if (state.category === "자체자료") {
        if (!state.internal && listEl.querySelector("form")) return;
        listEl.innerHTML = "";
        if (state.internal) { showInternal(); return; }
        countEl.textContent = "";
        var spw = null; try { spw = sessionStorage.getItem(KEY_OK); } catch (e) {}
        if (spw && !state.autoTried) { state.autoTried = true; tryUnlock(spw, null).then(function (ok) { if (!ok) renderInternal(); }); return; }
        renderInternal(); return;
      }
      var rows = state.items.filter(function (it) {
        if (state.category !== "전체" && it.category !== state.category) return false;
        if (!q) return true;
        var hay = [it.title, it.prefix, it.source, it.series].concat(it.summary || [], it.implications || [], (it.sections || []).map(function (x) { return x.title; })).join(" ").toLowerCase();
        return hay.indexOf(q) >= 0;
      }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      listEl.innerHTML = "";
      countEl.textContent = "총 " + rows.length + "건";
      if (!rows.length) { listEl.appendChild(el("div", "rp-empty", state.category !== "전체" && !state.query.trim() ? "해당 분류에 등록된 자료가 없습니다." : "조건에 맞는 자료가 없습니다.")); return; }
      rows.forEach(function (it) { listEl.appendChild(card(it)); });
    }

    document.getElementById("q").addEventListener("input", function (e) { state.query = e.target.value; render(); });

    fetch("reports.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        state.items = data.items || [];
        state.locked = [];
        try {
          var lt = null;
          state.items.forEach(function (it) {
            var k = (it.added || it.date || "") + "|" + (it.date || "");
            if (!lt || k > lt.k) lt = { k: k, id: it.id };
          });
          if (lt && lt.id) localStorage.setItem("energyReport.seen", lt.id);
        } catch (e) {}
        if (data.updated) document.getElementById("headerDate").textContent = fmtDate(data.updated);
        state.items.sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
        renderCats();
        render();
      })
      .catch(function () {
        listEl.appendChild(el("div", "rp-empty", "자료를 불러오지 못했습니다. 파일을 직접 열었다면 웹 주소(GitHub Pages)로 접속해 주세요."));
      });
  })();
  </script>
</body>
