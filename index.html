<body>

    <div class="in">
      <div>
        <h1>에너지 자료실</h1>
        <p class="sub">최종 업데이트: <b id="headerDate">-</b> | 국내외 기관 리포트 요약 | 에너지사업총괄</p>
      </div>
      <nav class="menu">
        <a href="https://shycrt-lgtm.github.io/KPX-Daily-Report/">전력시장<br class="mb"> 전일실적 <span>›</span></a>
        <a href="https://shycrt-lgtm.github.io/Energy-Index/">에너지 시장<br class="mb"> 주요정보 <span>›</span></a>

      </nav>
    </div>
  </header>

  <div class="mx-auto" style="max-width:1000px;padding:28px 16px 48px">
    <div class="flex" style="justify-content:space-between;align-items:stretch;gap:10px 12px;flex-wrap:wrap">
      <nav class="etc-menu" id="cats"></nav>
      <div class="kpx-pick flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm" style="margin-left:auto">
        <label for="q" class="text-xs md:text-sm font-bold text-slate-700 cursor-pointer">검색:</label>
        <input type="search" id="q" class="bg-transparent text-xs md:text-sm font-bold text-slate-800 outline-none" placeholder="제목·요약 검색">
      </div>
    </div>

    <div>
      <h2>리포트 목록</h2>
      <p class="text-xs text-slate-500 mb-2" id="count"></p>
      <div id="list"></div>
      <p class="text-[11px] text-slate-500 mt-2 px-1 tracking-tight">* 요약·시사점은 Claude가 원문을 읽고 작성한 것으로, 수치와 해석은 원문 확인이 필요합니다. 원문 저작권은 각 발행 기관에 있습니다.</p>
    </div>
  </div>

  <script>
  (function () {
    var state = { items: [], category: "전체", query: "" };
    var listEl = document.getElementById("list");
    var catsEl = document.getElementById("cats");
    var countEl = document.getElementById("count");

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function fmtDate(s) { return (s || "").replace(/-/g, "."); }
    function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }

    function renderCats() {
      var cats = ["전체"];
      state.items.forEach(function (it) {
        if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category);
      });
      catsEl.style.display = cats.length <= 2 ? "none" : "";
      catsEl.innerHTML = "";
      cats.forEach(function (c) {
        var a = el("a", "cat-btn", c);
        a.setAttribute("role", "button");
        a.setAttribute("aria-pressed", String(c === state.category));
        a.style.minWidth = "110px";
        a.addEventListener("click", function () { state.category = c; renderCats(); render(); });
        catsEl.appendChild(a);
      });
    }

    function link(label, url, primary) {
      var a = el("a", primary ? "primary" : "", label);
      a.href = safeUrl(url);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      return a;
    }

    function card(it) {
      var c = el("article", "rp-card");
      var meta = el("div", "rp-meta");
      meta.appendChild(el("span", "rp-tag", it.category || "기타"));
      meta.appendChild(el("span", "", it.source || ""));
      if (it.series) meta.appendChild(el("span", "", "| " + it.series));
      meta.appendChild(el("span", "", "| " + fmtDate(it.date)));
      c.appendChild(meta);
      var h3 = el("h3", "");
      if (it.prefix) h3.appendChild(el("span", "rp-prefix", "[" + it.prefix + "] "));
      h3.appendChild(document.createTextNode(it.title));
      c.appendChild(h3);
      if (it.period) c.appendChild(el("p", "rp-period", (it.period_label || "대상 기간") + ": " + it.period));

      var sum = it.summary || [];
      var ul = el("ul", "rp-sum");
      sum.slice(0, 3).forEach(function (s) { ul.appendChild(el("li", "", s)); });
      c.appendChild(ul);
      if (sum.length > 3) {
        var d = el("details");
        d.appendChild(el("summary", "", "요약 전체 보기 (" + sum.length + "건)"));
        var ul2 = el("ul", "rp-sum");
        ul2.style.marginTop = "8px";
        sum.slice(3).forEach(function (s) { ul2.appendChild(el("li", "", s)); });
        d.appendChild(ul2);
        c.appendChild(d);
      }
      if (it.implications && it.implications.length) {
        var box = el("div", "rp-impl");
        box.appendChild(el("b", "", "시사점"));
        var iu = el("ul");
        it.implications.forEach(function (s) { iu.appendChild(el("li", "", s)); });
        box.appendChild(iu);
        c.appendChild(box);
      }
      var nav = el("nav", "etc-menu rp-links");
      nav.appendChild(link(it.link_label || "원문 보기", it.url, true));
      if (it.detail_url) nav.appendChild(link("게시글 보기", it.detail_url, false));
      c.appendChild(nav);
      return c;
    }

    function render() {
      var q = state.query.trim().toLowerCase();
      var rows = state.items.filter(function (it) {
        if (state.category !== "전체" && it.category !== state.category) return false;
        if (!q) return true;
        var hay = [it.title, it.prefix, it.source, it.series].concat(it.summary || [], it.implications || []).join(" ").toLowerCase();
        return hay.indexOf(q) >= 0;
      }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      listEl.innerHTML = "";
      countEl.textContent = "총 " + rows.length + "건";
      if (!rows.length) { listEl.appendChild(el("div", "rp-empty", state.category !== "전체" && !state.query.trim() ? "해당 분류에 등록된 자료가 없습니다." : "조건에 맞는 자료가 없습니다.")); return; }
      rows.forEach(function (it) { listEl.appendChild(card(it)); });
    }

    document.getElementById("q").addEventListener("input", function (e) { state.query = e.target.value; render(); });

    fetch("reports.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        state.items = data.items || [];
        try {
          var lt = null;
          state.items.forEach(function (it) {
            var k = (it.added || it.date || "") + "|" + (it.date || "");
            if (!lt || k > lt.k) lt = { k: k, id: it.id };
          });
          if (lt && lt.id) localStorage.setItem("energyReport.seen", lt.id);
        } catch (e) {}
        if (data.updated) document.getElementById("headerDate").textContent = fmtDate(data.updated);
        renderCats();
        render();
      })
      .catch(function () {
        listEl.appendChild(el("div", "rp-empty", "자료를 불러오지 못했습니다. 파일을 직접 열었다면 웹 주소(GitHub Pages)로 접속해 주세요."));
      });
  })();
  </script>
</body>
</html>
